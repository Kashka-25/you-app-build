<!DOCTYPE html>
<html lang="en" data-mode="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>YOU — Living Biography</title>
    <meta name="theme-color" content="#0E4A57" />
    <!-- The Seeker's chosen side (Ocean or Cosmos), applied before the app
         draws so there's no flash of the other one. Saved by AppShell. -->
    <script>
      try {
        var m = localStorage.getItem("you.mode");
        if (m === "dark" || m === "light") {
          document.documentElement.setAttribute("data-mode", m);
          document.querySelector('meta[name="theme-color"]').setAttribute("content", m === "dark" ? "#0B0B1F" : "#0E4A57");
        }
      } catch (e) {}
    </script>
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" href="/favicon-32x32.png" sizes="32x32" />
    <link rel="icon" href="/favicon-64x64.png" sizes="64x64" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="YOU" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
