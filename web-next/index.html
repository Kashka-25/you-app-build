<!DOCTYPE html>
<html lang="en" data-mode="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>YOU — Your Own Universe</title>
    <meta name="description" content="A quiet place to grow into who you already are. Plant habits, goals and dreams, find your values, and write your story." />
    <!-- What a shared link shows (messages, socials). -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://yourownuniverse.life/" />
    <meta property="og:title" content="YOU — Your Own Universe" />
    <meta property="og:description" content="A quiet place to grow into who you already are." />
    <meta property="og:image" content="https://yourownuniverse.life/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="theme-color" content="#3A2618" />
    <!-- The Seeker's chosen side (Ocean or Cosmos), applied before the app
         draws so there's no flash of the other one. Saved by AppShell. -->
    <script>
      try {
        var m = localStorage.getItem("you.mode");
        if (m === "dark" || m === "light") {
          document.documentElement.setAttribute("data-mode", m);
          document.querySelector('meta[name="theme-color"]').setAttribute("content", m === "dark" ? "#0B0B1F" : "#3A2618");
        }
        // The Seeker's colour scale for that side (lib/colourScale.js).
        var v = JSON.parse(localStorage.getItem("you.scale.vars") || "{}")[m === "dark" ? "dark" : "light"];
        if (v) for (var k in v) document.documentElement.style.setProperty(k, v[k]);
      } catch (e) {}
    </script>
    <link rel="manifest" href="/manifest.json" />
    <!-- favicon.ico too: address bars, bookmarks and Safari ask for it by
         name, and without it they got the app page and showed plain text. -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" href="/favicon-32x32.png" sizes="32x32" />
    <link rel="icon" href="/favicon-64x64.png" sizes="64x64" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="YOU" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet" />
    <!-- The opening splash: the full YOU logo, painted with the very first
         frame (before the app's code arrives) and in the same place as the
         app's own loading screen, so opening YOU shows one splash, not a
         blank page then a second one. React replaces it when it starts. -->
    <link rel="preload" as="image" href="/logo-full.png" />
    <style>
      html, body { margin: 0; background: #F7F1E8; }
      html[data-mode="dark"], html[data-mode="dark"] body { background: #0B0B1F; }
      .boot { min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 20px; padding: 64px 24px; box-sizing: border-box; text-align: center; }
      .boot img { width: 100%; max-width: 240px; height: auto; }
      .boot p { margin: 0; max-width: 240px; font: italic 500 16px/1.4 "Cormorant Garamond", Georgia, serif; color: #6A5646; }
      html[data-mode="dark"] .boot p { color: #B8B5D6; }
    </style>
  </head>
  <body>
    <div id="root"><div class="boot"><img src="/logo-full.png" alt="YOU — Your Own Universe" width="720" height="621" /><p>Come back to yourself, whenever you're ready.</p></div></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
